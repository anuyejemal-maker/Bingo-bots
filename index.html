<!-- index.html keessatti bakka Wallet fi Button-otaa -->
<div id="wallet" style="background: #2ed573; padding: 10px;">Balance: <span id="bal">0</span> ETB</div>

<div id="status">Lakkoofsa 25 filadhu: <span id="count">0</span>/25</div>

<div id="board" class="grid">
    <!-- Lakkoofsota 1-75 hunda asitti fiduu (User-ni akka filatuuf) -->
</div>

<button id="startBtn" disabled onclick="startGame()">Tapha Jalqabi</button>
<button id="confirmBtn" disabled onclick="confirmSelection()" style="display: none; margin-left: 10px;">Confirm</button>

<script>
    let myNumbers = []; // Lakkoofsota taphataan filate
    let balance = 100; // Firebase irraa dubbisna (ammaaf 100 haa ta'u)

    // Lakkoofsa 1-75 uumuu
    const board = document.getElementById('board');
    for (let i = 1; i <= 75; i++) {
        let div = document.createElement('div');
        div.className = 'cell';
        div.innerText = i;
        div.onclick = () => {
            if (myNumbers.length < 25 && !myNumbers.includes(i)) {
                myNumbers.push(i);
                div.classList.add('selected');
                document.getElementById('count').innerText = myNumbers.length;
                if (myNumbers.length === 25) {
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('confirmBtn').disabled = false;
                    document.getElementById('confirmBtn').style.display = 'inline-block';
                }
            }
        };
        board.appendChild(div);
    }

    function startGame() {
        // Taphatichi lakkoofsa 25 qofa akka filatu godhi
        if (myNumbers.length !== 25) {
            alert("Lakkoofsa 25 qofa filadhu! Amma " + myNumbers.length + " filatte.");
            return;
        }
        // Asitti Firebase waliin wal qunnamsiifna
        alert("Tapha jalqabdeetta! Balance kee: " + balance);
    }

    function confirmSelection() {
        // Gaafa 25 guutu, filannoo mirkaneessuu
        alert("Filannoo kee mirkaneessinu! Lakkoofsi: " + myNumbers.join(", "));
        // Firebase waliin wal qunnamsiifna
        console.log("Confirmed numbers:", myNumbers);
    }
</script>
